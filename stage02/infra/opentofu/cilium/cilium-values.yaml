# Cilium Helm values for Talos Linux
#
# Assumptions:
# - Talos CNI is set to "none"
# - Talos kube-proxy is disabled
# - Talos KubePrism is enabled on localhost:7445
# - Cilium overlay routing uses VXLAN
# - Gateway API CRDs are installed by the Talos root

# Keep these DHI versions aligned with the pinned Cilium chart (1.20.1).
# Full overrides bypass upstream digests and the operator's image-name suffix.
imagePullSecrets:
  - name: dhi-pull-secret

image:
  override: dhi.io/cilium:1.20.1-debian13

operator:
  image:
    override: dhi.io/cilium-operator-generic:1.20.1-debian13

envoy:
  image:
    # The chart executes /usr/bin/cilium-envoy-starter, supplied by compat.
    override: dhi.io/cilium-envoy:1.20.1-debian13-compat

certgen:
  image:
    override: dhi.io/cilium-certgen:0.4.9-debian13

ipam:
  mode: kubernetes

cni:
  # Talos has no AWS VPC CNI rules to remove. Avoid the upstream postStart
  # hook that invokes iptables-save/restore for AWS migration cleanup.
  iptablesRemoveAWSRules: false

kubeProxyReplacement: true

# Use Talos KubePrism as the Kubernetes API endpoint.
k8sServiceHost: localhost
k8sServicePort: 7445

# Required when Talos Host DNS is used with Cilium.
bpf:
  hostLegacyRouting: true

# Talos already provides the cgroup v2 mount.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Talos does not permit workloads to load kernel modules, so SYS_MODULE is
# deliberately omitted.
podSecurityContext:
  # DHI defaults to UID 65532. The agent and its init containers require root
  # for root-owned emptyDir/hostPath mounts and host network initialization.
  # Set this at Pod level so config, sysctl, cleanup, and CNI installation inherit it.
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

routingMode: tunnel
tunnelProtocol: vxlan

l7Proxy: true

gatewayAPI:
  enabled: true

  gatewayClass:
    create: true

  enableAlpn: true
  enableAppProtocol: true

l2announcements:
  enabled: true

hubble:
  enabled: true

  relay:
    enabled: true
    image:
      override: dhi.io/hubble-relay:1.20.1-debian13

  ui:
    enabled: true
    # Match ownership of nginx and backend files in the DHI images.
    securityContext:
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
    frontend:
      image:
        override: dhi.io/hubble-ui:0.13.5-debian13
    backend:
      image:
        override: dhi.io/hubble-ui-backend:0.13.5-debian13

  tls:
    enabled: true
    auto:
      enabled: true
      method: cronJob
