# Upstream cloudnative-pg chart 0.29.0 with the Docker Hardened operator image.
fullnameOverride: cnpg-controller-manager

replicaCount: 1

image:
  repository: dhi.io/cloudnative-pg
  tag: "1.30.0"

# Copy the Stage 02 registry credential into cnpg-system before installation.
imagePullSecrets:
  - name: dhi-pull-secret

crds:
  create: true

# One operator manages application-owned PostgreSQL clusters across namespaces.
config:
  clusterWide: true

# Match the DHI runtime image's non-root identity instead of the upstream UID.
containerSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
