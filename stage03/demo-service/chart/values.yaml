# Resource names intentionally stay demo-service for migration compatibility.
# Install only one release per namespace.
image:
  repository: docker.io/johanneskuhfuss/demo-service
  # Required: a published version or commit tag. No implicit latest image.
  tag: ""
  pullPolicy: IfNotPresent
replicaCount: 1
resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 128Mi
logging:
  format: text
  level: info
shutdown:
  drainSeconds: 12
  timeoutSeconds: 10
  terminationGracePeriodSeconds: 30
clusterDomain: cluster.local
hostname: demo.tc.jku.internal
gateway:
  name: internal-web
  namespace: observability
  sectionName: demo-service
certificate:
  duration: 1h
  renewBefore: 15m
  issuerRef:
    kind: ClusterIssuer
    name: tc-jku-cluster-ca
trustBundleName: tc-jku-internal-ca
