apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-service
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Limit revision history to limit clutter
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-service
    spec:
      # The chart validates that the grace period exceeds drain + shutdown.
      terminationGracePeriodSeconds: {{ .Values.shutdown.terminationGracePeriodSeconds }}
      securityContext:
        # Comply with PSA Restricted 
        # Do not run as root
        runAsNonRoot: true
        # Specify user and group, same as in Dockerfile
        runAsUser: 65532
        runAsGroup: 65532
        # Use default seccomp profile
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-service
          image: {{ printf "%s:%s" .Values.image.repository (required "Set image.tag to a published version or commit tag" .Values.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          # Specify environment variables
          # The first 4 environment variables inject K8s runtime information into the Pod for display purposes
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "8080"
            - name: SERVER_TLS_PORT
              value: "8443"
            - name: USE_TLS
              value: "true"
            - name: DRAIN_REQUESTS_TIME
              value: {{ .Values.shutdown.drainSeconds | quote }}
            - name: GRACEFUL_SHUTDOWN_TIME
              value: {{ .Values.shutdown.timeoutSeconds | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.logging.format | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: GIN_MODE
              value: "release"
            - name: CERT_FILE
              value: /var/run/demo-service/tls/tls.crt
            - name: KEY_FILE
              value: /var/run/demo-service/tls/tls.key

          # Expose ports
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP

          # Define startup probe (Has the app finished starting?)
          startupProbe:
            httpGet:
              path: /health/startup
              port: https
              scheme: HTTPS
            # Tune the following to your service
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30

          # Define readiness probe (can this service receive traffic?)
          readinessProbe:
            httpGet:
              path: /health/ready
              port: https
              scheme: HTTPS
            # Tune the following to your service
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          # Define liveness probe (is the app live / not stuck?)
          livenessProbe:
            httpGet:
              path: /health/live
              port: https
              scheme: HTTPS
            # Tune the following to your service
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # Tune the following to your service
          resources:{{ toYaml .Values.resources | nindent 12 }}

          securityContext:
            # Do not allow service to gain privileges
            allowPrivilegeEscalation: false
            # Do not allow to run privileged
            privileged: false
            # Keep root file system read-only
            readOnlyRootFilesystem: true
            # Drop all capabilities
            # Add back selectively if needed
            capabilities:
              drop:
                - ALL
          # Mount volume with certificate
          volumeMounts:
            - name: backend-tls
              mountPath: /var/run/demo-service/tls
              readOnly: true
      # Volume for the certificate
      volumes:
        - name: backend-tls
          secret:
            secretName: demo-service-backend-tls

