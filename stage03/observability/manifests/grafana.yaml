apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-backend
  namespace: observability
spec:
  secretName: grafana-backend-tls
  duration: 168h
  renewBefore: 48h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: tc-jku-cluster-ca
  dnsNames:
    - grafana.observability.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Always
  usages: [digital signature, server auth]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - name: internal-web
      namespace: observability
      sectionName: grafana
  hostnames: [grafana.tc.jku.internal]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: grafana
  namespace: observability
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: grafana
      sectionName: https
  validation:
    hostname: grafana.observability.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: tc-jku-internal-ca
