# Select only this stack, not Hubble or the shared Gateway in this namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: observability-backends
  namespace: observability
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values: [prometheus, loki, tempo]
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: In
              values: [grafana, prometheus, loki, tempo, alloy]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: observability-grafana
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: grafana
      app.kubernetes.io/name: grafana
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: observability-alloy
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: alloy
      app.kubernetes.io/name: alloy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/instance: prometheus
      toPorts:
        - ports:
            - port: "12345"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.telemetry.tc.jku.internal/client: "true"
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
            - port: "4318"
              protocol: TCP
