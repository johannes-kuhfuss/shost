# trust-manager Helm values for the Stage 03 internal CA trust bundle.

image:
  repository: dhi.io/trust-manager
  tag: "0.24.0"

imagePullSecrets:
  - name: dhi-pull-secret

crds:
  enabled: true
  keep: true

# This installation distributes only the explicitly configured private root.
# Do not pull an unused operating-system CA package into the controller Pod.
defaultPackage:
  enabled: false

# CNPG requires a Secret for its public server CA bundle. Restrict writable
# Secret names; enabling this also grants cluster-wide Secret read access.
secretTargets:
  enabled: true
  authorizedSecretsAll: false
  authorizedSecrets:
    - tc-jku-cnpg-ca

# Reject accidental non-CA material in configured Bundle sources.
filterNonCACerts:
  enabled: true

app:
  trust:
    namespace: cert-manager
