name: Demo service

on:
  push:
    paths:
      - "stage03/demo-service/**"
      - ".github/workflows/demo-service.yml"
  pull_request:
    paths:
      - "stage03/demo-service/**"
      - ".github/workflows/demo-service.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage03/demo-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: stage03/demo-service/go.mod
          cache-dependency-path: stage03/demo-service/go.sum

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Vet
        run: go vet ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stage03/demo-service/e2e/package-lock.json

      - name: Install browser test dependencies
        working-directory: stage03/demo-service/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser readiness recovery test
        working-directory: stage03/demo-service/e2e
        run: npm test

      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0

      - name: Validate Helm chart
        shell: bash
        run: |
          set -euo pipefail
          helm lint chart --strict --set-string image.tag=ci
          helm lint chart --strict -f values-lab.yaml --set-string image.tag=ci
          mkdir -p rendered
          helm template demo-service chart --namespace demo-service -f values-lab.yaml --set-string image.tag=ci > rendered/demo-service.yaml
          helm template demo-service chart --namespace demo-test --set-string image.tag=ci \
            --set clusterDomain=example.local --set logging.level=debug --set logging.format=json \
            --set replicaCount=2 > rendered/alternate.yaml
          test "$(grep -c 'demo-service.demo-test.svc.example.local' rendered/alternate.yaml)" -eq 2
          grep -q 'replicas: 2' rendered/alternate.yaml
          grep -q 'value: "debug"' rendered/alternate.yaml
          grep -q 'value: "json"' rendered/alternate.yaml
          if helm template demo-service chart --set-string image.tag=ci --set shutdown.terminationGracePeriodSeconds=22; then
            echo 'Chart accepted an insufficient shutdown budget' >&2
            exit 1
          fi
          if helm template demo-service chart; then
            echo 'Chart accepted a missing image tag' >&2
            exit 1
          fi
          if helm template demo-service chart --set-string image.tag=ci --set logging.level=fatal; then
            echo 'Chart accepted an invalid logging level' >&2
            exit 1
          fi

      - name: Validate rendered Kubernetes manifests
        run: >-
          docker run --rm
          -v "${PWD}/rendered:/rendered:ro"
          -v "${PWD}/manifests:/manifests:ro"
          ghcr.io/yannh/kubeconform:v0.7.0
          -strict -summary -ignore-missing-schemas /rendered /manifests

      - name: Verify shutdown budget
        shell: bash
        run: |
          set -euo pipefail
          termination="$(awk '/terminationGracePeriodSeconds:/ { print $2 }' rendered/demo-service.yaml)"
          drain="$(awk '/name: DRAIN_REQUESTS_TIME/ { getline; gsub(/"/, "", $2); print $2 }' rendered/demo-service.yaml)"
          shutdown="$(awk '/name: GRACEFUL_SHUTDOWN_TIME/ { getline; gsub(/"/, "", $2); print $2 }' rendered/demo-service.yaml)"
          test "$termination" -gt "$((drain + shutdown))"

      - name: Authenticate to DHI
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          set -euo pipefail
          : "${DHI_USERNAME:?Configure the DHI_USERNAME repository secret}"
          : "${DHI_TOKEN:?Configure the DHI_TOKEN repository secret}"
          printf '%s' "$DHI_TOKEN" | docker login dhi.io --username "$DHI_USERNAME" --password-stdin

      - name: Build container
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: docker build -t demo-service:test .

      - name: Smoke-test hardened container
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --read-only --user 65532:65532 --publish 18080:8080 demo-service:test)"
          trap 'docker logs "$container_id"; docker rm --force "$container_id" >/dev/null' EXIT

          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "65532:65532"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready | grep --quiet '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Log out of DHI
        if: always() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: docker logout dhi.io
